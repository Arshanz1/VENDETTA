<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VENDETTA | Music Arena</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#080808;
  color:white;
  font-family:Arial,sans-serif;
}
header{
  padding:25px 15px;
  text-align:center;
  background:linear-gradient(135deg,#160000,#080808);
  border-bottom:1px solid #650000;
}
.logo{
  font-size:38px;
  font-weight:900;
  letter-spacing:5px;
  color:#ff2020;
  text-shadow:0 0 20px #b00000;
}
header p{color:#aaa;letter-spacing:3px}
.container{max-width:850px;margin:auto;padding:20px}
h2{
  color:#ff3030;
  border-bottom:1px solid #441010;
  padding-bottom:10px;
}
.box{
  background:#151515;
  border:1px solid #333;
  border-radius:12px;
  padding:18px;
  margin:18px 0;
}
input{
  width:100%;
  padding:13px;
  margin:7px 0;
  border-radius:7px;
  border:1px solid #444;
  background:#080808;
  color:white;
}
button{
  background:#b00000;
  color:white;
  border:0;
  border-radius:7px;
  padding:12px 18px;
  cursor:pointer;
  font-weight:bold;
  margin:5px;
}
button:hover{background:#ed1717}
.song{
  background:#171717;
  border:1px solid #333;
  border-right:4px solid #c00000;
  border-radius:10px;
  padding:15px;
  margin:12px 0;
}
.song h3{margin:5px 0;color:white}
.song p{color:#aaa}
audio{width:100%;margin-top:12px}
.vote{background:#242424}
.hidden{display:none}
#message{color:#ff5555;margin:10px 0}
footer{
  text-align:center;
  color:#666;
  padding:30px;
}
</style>
</head>

<body>

<header>
  <div class="logo">VENDETTA</div>
  <p>THE MUSIC ARENA</p>
</header>

<div class="container">

  <div class="box">
    <h2>ورود / ثبت‌نام</h2>
    <input id="email" type="email" placeholder="ایمیل">
    <input id="password" type="password" placeholder="رمز عبور">
    <button onclick="signUp()">ثبت‌نام</button>
    <button onclick="signIn()">ورود</button>
    <button onclick="signOut()">خروج</button>
    <p id="userStatus">وارد حساب نشده‌اید.</p>
    <p id="message"></p>
  </div>
