<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VENDETTA | Music Arena</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#080808;
 color:white;
 font-family:Arial,sans-serif;
}
header{
 text-align:center;
 padding:30px 15px;
 background:#111;
 border-bottom:2px solid #e00024;
}
.logo{
 font-size:38px;
 font-weight:bold;
 color:#ff173b;
 letter-spacing:5px;
}
header p{color:#aaa}
.container{
 max-width:750px;
 margin:auto;
 padding:15px;
}
.box{
 background:#151515;
 border:1px solid #333;
 border-radius:12px;
 padding:18px;
 margin:18px 0;
}
h2{color:#ff2445}
input{
 width:100%;
 padding:13px;
 margin:7px 0;
 background:#222;
 border:1px solid #444;
 border-radius:7px;
 color:white;
}
button{
 background:#d90029;
 color:white;
 border:0;
 padding:12px 18px;
 margin:5px;
 border-radius:7px;
 cursor:pointer;
}
button:hover{background:#ff1744}
.song{
 background:#202020;
 padding:15px;
 border-radius:10px;
 margin:12px 0;
 border-right:3px solid #ed1237;
}
.song h3{margin:5px 0}
audio{width:100%;margin-top:10px}
.vote{background:#333}
.hidden{display:none}
#message{color:#ff5555}
footer{
 text-align:center;
 color:#777;
 padding:30px;
}
</style>
</head>

<body>

<header>
 <div class="logo">VENDETTA</div>
 <p>THE MUSIC ARENA</p>
</header>

<div class="container">

<div class="box">
 <h2>ثبت‌نام / ورود</h2>
 <input id="email" type="email" placeholder="ایمیل">
 <input id="password" type="password" placeholder="رمز عبور">
 <button onclick="signUp()">ثبت‌نام</button>
 <button onclick="signIn()">ورود</button>
 <button onclick="signOut()">خروج</button>
 <p id="userStatus">وارد حساب نشده‌اید.</p>
 <p id="message"></p>
</div>

<div class="box hidden" id="adminPanel">
 <h2>پنل مدیریت</h2>
 <p>افزودن آهنگ جدید</p>
 <input id="songTitle" placeholder="نام آهنگ">
 <input id="songArtist" placeholder="نام خواننده">
 <input id="songFile" type="file" accept="audio/*">
 <button onclick="uploadSong()">آپلود آهنگ</button>
</div>

<div class="box">
 <h2>آهنگ‌ها و رأی‌گیری</h2>
 <div id="songsList">در حال دریافت آهنگ‌ها...</div>
</div>

</div>

<footer>
 VENDETTA © THE MUSIC ARENA
</footer>

<script>
const SUPABASE_URL = "https://grnokvmumqdohcgawnjo.supabase.co";

const SUPABASE_KEY = "sb_publishable_x4k63M841VGY_1Th0qck0g_xmswFRac";

const db = window.supabase.createClient(
 SUPABASE_URL,
 SUPABASE_KEY
);

let currentUser = null;
let isAdmin = false;

function showMessage(text){
 document.getElementById("message").textContent = text;
}

async function signUp(){
 const email = document.getElementById("email").value.trim();
 const password = document.getElementById("password").value;

 if(!email || !password){
  showMessage("ایمیل و رمز عبور را وارد کنید.");
  return;
 }

 const {error} = await db.auth.signUp({email,password});

 if(error) showMessage(error.message);
 else showMessage("ثبت‌نام انجام شد. اگر تأیید ایمیل فعال است، ایمیلت را بررسی کن.");
}

async function signIn(){
 const email = document.getElementById("email").value.trim();
 const password = document.getElementById("password").value;

 const {error} = await db.auth.signInWithPassword({
  email,password
 });

 if(error) showMessage(error.message);
 else showMessage("ورود موفقیت‌آمیز بود.");
}

async function signOut(){
 const {error} = await db.auth.signOut();
 if(error) showMessage(error.message);
 else showMessage("از حساب خارج شدید.");
}

async function checkUser(){
 const {data} = await db.auth.getUser();
 currentUser = data.user;

 const status = document.getElementById("userStatus");
 const panel = document.getElementById("adminPanel");

 if(!currentUser){
  status.textContent = "وارد حساب نشده‌اید.";
  panel.classList.add("hidden");
  isAdmin = false;
  return;
 }

 status.textContent = "وارد شده‌اید: " + currentUser.email;

 const {data:adminData,error} = await db
  .from("admins")
  .select("user_id")
  .eq("user_id",currentUser.id)
  .maybeSingle();

 isAdmin = !error && !!adminData;

 if(isAdmin) panel.classList.remove("hidden");
 else panel.classList.add("hidden");
}

async function loadSongs(){
 const list = document.getElementById("songsList");
 list.textContent = "در حال دریافت آهنگ‌ها...";

 const {data:songs,error} = await db
  .from("songs")
  .select("*")
  .order("created_at",{ascending:false});

 if(error){
  list.textContent = "خطا در دریافت آهنگ‌ها: " + error.message;
  return;
 }

 if(!songs || songs.length === 0){
  list.textContent = "هنوز آهنگی اضافه نشده است.";
  return;
 }

 const {data:votes,error:votesError} = await db
  .from("votes")
  .select("song_id");

 if(votesError){
  list.textContent = "خطا در دریافت رأی‌ها.";
  return;
 }

 list.innerHTML = "";

 songs.forEach(song=>{
  const count = votes.filter(v=>v.song_id === song.id).length;

  const item = document.createElement("div");
  item.className = "song";

  const title = document.createElement("h3");
  title.textContent = song.title;

  const artist = document.createElement("p");
  artist.textContent = song.artist || "خواننده نامشخص";

  const audio = document.createElement("audio");
  audio.controls = true;
  audio.preload = "none";
  audio.src = song.file_path;

  const voteCount = document.createElement("p");
  voteCount.textContent = "تعداد رأی‌ها: " + count;

  const button = document.createElement("button");
  button.className = "vote";
  button.textContent = "رأی دادن";
  button.onclick = ()=>vote(song.id);

  item.append(title,artist,audio,voteCount,button);
  list.appendChild(item);
 });
}

async function vote(songId){
 if(!currentUser){
  alert("برای رأی دادن ابتدا وارد حساب شوید.");
  return;
 }

 const {error} = await db.from("votes").insert({
  song_id:songId,
  user_id:currentUser.id
 });

 if(error){
  if(error.code === "23505"){
   alert("شما قبلاً به این آهنگ رأی داده‌اید.");
  }else{
   alert("خطا در ثبت رأی: " + error.message);
  }
  return;
 }

 alert("رأی شما ثبت شد!");
 loadSongs();
}

async function uploadSong(){
 if(!isAdmin){
  alert("فقط مدیر اجازه آپلود آهنگ دارد.");
  return;
 }

 const title = document.getElementById("songTitle").value.trim();
 const artist = document.getElementById("songArtist").value.trim();
 const file = document.getElementById("songFile").files[0];

 if(!title || !file){
  alert("نام آهنگ و فایل آن را وارد کنید.");
  return;
 }

 const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g,"_");
 const path = Date.now() + "_" + safeName;

 const {error:uploadError} = await db.storage
  .from("songs")
  .upload(path,file);

 if(uploadError){
  alert("خطا در آپلود: " + uploadError.message);
  return;
 }

 const {data:urlData} = db.storage
  .from("songs")
  .getPublicUrl(path);

 const {error:insertError} = await db
  .from("songs")
  .insert({
   title:title,
   artist:artist,
   file_path:urlData.publicUrl
  });

 if(insertError){
  alert("فایل آپلود شد اما ثبت اطلاعات آهنگ خطا داشت: " + insertError.message);
  return;
 }

 alert("آهنگ با موفقیت اضافه شد!");

 document.getElementById("songTitle").value = "";
 document.getElementById("songArtist").value = "";
 document.getElementById("songFile").value = "";

 loadSongs();
}

db.auth.onAuthStateChange(()=>{
 setTimeout(async ()=>{
  await checkUser();
  await loadSongs();
 },300);
});

async function start(){
 await checkUser();
 await loadSongs();
}

start();
</script>

</body>
</html>
